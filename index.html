<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時計</title>
<style>
  /* Notionの配色に合わせて、埋め込んだときに背景が浮かないようにする */
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --sub: #787774;
    --track: #e9e9e7;
    --accent: #2383e2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919;
      --text: #d4d4d4;
      --sub: #9b9b9b;
      --track: #2f2f2f;
      --accent: #529cca;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919;
    --text: #d4d4d4;
    --sub: #9b9b9b;
    --track: #2f2f2f;
    --accent: #529cca;
    color-scheme: dark;
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .clock {
    width: 100%;
    padding: 0 6vw;
    box-sizing: border-box;
  }
  .row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    column-gap: 4vw;
  }
  .time {
    font-variant-numeric: tabular-nums;
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1;
    font-size: min(22vw, 58vh);
  }
  .date {
    color: var(--sub);
    font-size: min(5.5vw, 14vh);
    line-height: 1.2;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="clock" id="clock">
    <div class="row">
      <div class="date" id="date"></div>
      <div class="time" id="hm">--:--</div>
    </div>
  </div>

<script>
  // URLの末尾で表示を切り替えられる
  //   ?theme=dark / ?theme=light  … 配色を固定(指定なしはOSの設定に合わせる)
  //   ?h12=1                      … 12時間表示
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme");
  if (theme === "dark" || theme === "light") {
    document.documentElement.setAttribute("data-theme", theme);
  }
  const h12 = params.get("h12") === "1";

  const hm = document.getElementById("hm");
  const date = document.getElementById("date");
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  const pad = n => String(n).padStart(2, "0");

  function tick() {
    const now = new Date();
    let h = now.getHours();
    let suffix = "";
    if (h12) {
      suffix = h < 12 ? "午前 " : "午後 ";
      h = h % 12 || 12;
    }
    hm.textContent = (h12 ? suffix : "") + (h12 ? h : pad(h)) + ":" + pad(now.getMinutes());
    date.textContent =
      (now.getMonth() + 1) + "月" + now.getDate() + "日(" + days[now.getDay()] + ")";
    // 次の秒の切り替わりに合わせて更新し、分の変わり目を逃さない
    setTimeout(tick, 1000 - now.getMilliseconds());
  }
  tick();
</script>
</body>
</html>
